<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>icon</title>
<!-- 旧程序图标构图存档；正式图标由make_icon.js读取assets/icon-source-v2.png导出。 -->
<style>html,body{margin:0;background:#05070a;color:#8a949c;font:12px/1.6 monospace}#icon{display:block;width:512px;height:512px}</style>
</head>
<body>
<canvas id="icon"></canvas>
<script src="../js/config.js"></script>
<script src="../js/render.js"></script>
<script>
/* 图标绘制：复用游戏自身的 drawHome / drawZombie，保证与游戏美术完全一致。
   输出正方形 1024×1024 母版，交给 tools/make_icon.js 导出多尺寸 PNG。 */
(function () {
  'use strict';

  var SIZE = 1024;
  var cv = document.getElementById('icon');
  cv.width = cv.height = SIZE;
  var ctx = cv.getContext('2d');

  Render.canvas = cv;
  Render.ctx = ctx;
  Render.damageFlash = { p: 0, g: 0 };
  Render.buildStatics();

  /* ---------- 构图常量 ---------- */
  var GROUND = 800;          // 房子地基所在的“地平线”
  var HOUSE_S = 2.15;        // 房子放大倍数
  var HOUSE_CX = 372;        // 房子中心
  var WALL_TOP = Math.round(CONFIG.TOP_H + (CONFIG.BOTTOM_Y - CONFIG.TOP_H) * 0.39);
  var WALL_BOT = WALL_TOP + 162;
  var TX = HOUSE_CX - 76 * HOUSE_S;
  var TY = GROUND - WALL_BOT * HOUSE_S;
  var RIFT_X = 884;
  function hx(gx) { return TX + gx * HOUSE_S; }
  function hy(gy) { return TY + gy * HOUSE_S; }

  var DOOR = { x: hx(56), y: hy(WALL_BOT - 56), w: 40 * HOUSE_S, h: 56 * HOUSE_S };

  function mkZ(o) {
    return {
      x: o.x, y: o.y, r: o.r || 17, scale: o.scale, tint: o.tint,
      phase: o.phase || 0, side: 'p', type: o.type || 'walker',
      attackT: o.attackT || 0, attackTotal: o.attackTotal || 1,
      attackHitT: o.attackHitT || 0, attackHitTotal: o.attackHitTotal || 1,
      hp: 1, maxHp: 1, slowT: 0, flash: 0
    };
  }

  /* ---------- 1. 天空 / 地面 ---------- */
  function background() {
    var sky = ctx.createLinearGradient(0, 0, 0, SIZE);
    sky.addColorStop(0, '#05070c');
    sky.addColorStop(0.42, '#0b1016');
    sky.addColorStop(0.60, '#12171c');
    sky.addColorStop(1, '#080b0e');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, SIZE, SIZE);

    // 裂隙侧的冷雾：别让右边死黑
    var haze = ctx.createRadialGradient(RIFT_X, 470, 0, RIFT_X, 470, 640);
    haze.addColorStop(0, 'rgba(120,150,180,0.10)');
    haze.addColorStop(1, 'rgba(120,150,180,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0, 0, SIZE, SIZE);

    var gnd = ctx.createLinearGradient(0, GROUND - 150, 0, SIZE);
    gnd.addColorStop(0, 'rgba(23,28,34,0)');
    gnd.addColorStop(0.45, 'rgba(24,29,36,0.92)');
    gnd.addColorStop(1, 'rgba(11,14,19,1)');
    ctx.fillStyle = gnd;
    ctx.fillRect(0, GROUND - 150, SIZE, SIZE - GROUND + 150);

    // 碎石 / 残骸（固定种子）
    var rr = mulberry32(20260922);
    for (var i = 0; i < 150; i++) {
      var x = rr() * SIZE;
      var y = GROUND - 40 + rr() * 250;
      if (y > SIZE) continue;
      var r = 2 + rr() * 7;
      ctx.fillStyle = 'rgba(' + (rr() > 0.5 ? '58,64,72' : '30,34,40') + ',' + (0.18 + rr() * 0.3) + ')';
      ctx.beginPath();
      ctx.ellipse(x, y, r * 1.7, r * 0.75, rr() * 3, 0, 6.283);
      ctx.fill();
    }
  }

  /* ---------- 2. 裂隙：折线状裂口，而不是一根光滑的柱子 ---------- */
  function rift() {
    var g = Render.glow('#ff3a1e', 512);
    ctx.globalAlpha = 0.24;
    ctx.drawImage(g, RIFT_X - 300, 520 - 300, 600, 600);
    ctx.globalAlpha = 1;

    var rr = mulberry32(90210);
    var nodes = [];
    for (var y = 176; y <= GROUND + 30; y += 44 + rr() * 42) {
      nodes.push({ y: y, x: RIFT_X + (rr() - 0.5) * 40, w: 5 + rr() * 21 });
    }
    var last = nodes[nodes.length - 1];
    nodes.push({ y: last.y + 40, x: RIFT_X + (rr() - 0.5) * 26, w: 4 });
    nodes[0].w = 5;
    var mid = (nodes.length - 1) / 2;
    for (var i = 0; i < nodes.length; i++) {
      var bulge = Math.sin(Math.PI * Math.min(1, i / (nodes.length - 1)));
      nodes[i].w *= 0.45 + 0.85 * bulge;
      if (i === Math.round(mid)) nodes[i].w *= 1.5;
    }

    ctx.beginPath();
    ctx.moveTo(nodes[0].x - nodes[0].w, nodes[0].y);
    for (var a = 1; a < nodes.length; a++) ctx.lineTo(nodes[a].x - nodes[a].w, nodes[a].y);
    for (var b = nodes.length - 1; b >= 0; b--) ctx.lineTo(nodes[b].x + nodes[b].w, nodes[b].y);
    ctx.closePath();

    var lg = ctx.createLinearGradient(RIFT_X - 46, 0, RIFT_X + 46, 0);
    lg.addColorStop(0, 'rgba(12,4,3,0.82)');
    lg.addColorStop(0.34, 'rgba(108,18,8,0.70)');
    lg.addColorStop(0.5, 'rgba(255,88,36,0.62)');
    lg.addColorStop(0.66, 'rgba(108,18,8,0.70)');
    lg.addColorStop(1, 'rgba(12,4,3,0.82)');
    ctx.fillStyle = lg;
    ctx.fill();

    ctx.save();
    ctx.clip();
    ctx.strokeStyle = 'rgba(255,206,150,0.42)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(nodes[0].x, nodes[0].y);
    for (var c = 1; c < nodes.length; c++) ctx.lineTo(nodes[c].x, nodes[c].y);
    ctx.stroke();
    ctx.restore();
  }

  /* ---------- 3. 房子（裁掉游戏里的血条） ---------- */
  function house() {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, SIZE, GROUND + 6);
    ctx.clip();
    ctx.translate(TX, TY);
    ctx.scale(HOUSE_S, HOUSE_S);
    Render.drawHome({ battle: { hp: { p: 100, g: 100 }, maxHp: { p: 100, g: 100 } } }, 'p', 0.37);
    ctx.restore();
  }

  /* ---------- 4. 门缝漏出的暖光 + 地面光池 ---------- */
  function doorLight() {
    var d = DOOR;
    var dg = ctx.createLinearGradient(0, d.y, 0, d.y + d.h);
    dg.addColorStop(0, 'rgba(255,186,96,0.16)');
    dg.addColorStop(0.55, 'rgba(255,196,110,0.34)');
    dg.addColorStop(1, 'rgba(255,214,140,0.62)');
    ctx.fillStyle = dg;
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 4;
    ctx.strokeRect(d.x, d.y, d.w, d.h);
    // 门板中缝
    ctx.strokeStyle = 'rgba(0,0,0,0.32)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(d.x + d.w / 2, d.y + 4);
    ctx.lineTo(d.x + d.w / 2, d.y + d.h - 4);
    ctx.stroke();

    // 僵尸抓痕
    ctx.lineCap = 'round';
    for (var i = 0; i < 3; i++) {
      var sx = d.x + 14 + i * 20;
      ctx.strokeStyle = 'rgba(58,12,8,0.55)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(sx, d.y + 10);
      ctx.lineTo(sx + 16, d.y + d.h - 6);
      ctx.stroke();
    }

    ctx.globalCompositeOperation = 'lighter';
    var pool = ctx.createRadialGradient(d.x + d.w / 2, d.y + d.h, 0, d.x + d.w / 2, d.y + d.h, 250);
    pool.addColorStop(0, 'rgba(255,196,110,0.20)');
    pool.addColorStop(1, 'rgba(255,196,110,0)');
    ctx.fillStyle = pool;
    ctx.fillRect(0, 0, SIZE, SIZE);
    var wide = ctx.createRadialGradient(HOUSE_CX, GROUND, 0, HOUSE_CX, GROUND, 460);
    wide.addColorStop(0, 'rgba(255,170,90,0.10)');
    wide.addColorStop(1, 'rgba(255,170,90,0)');
    ctx.fillStyle = wide;
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ---------- 5. 气氛：雾 + 暗角 + 颗粒 ---------- */
  function atmosphere() {
    ctx.save();
    var v = ctx.createRadialGradient(SIZE * 0.5, SIZE * 0.53, SIZE * 0.20, SIZE * 0.5, SIZE * 0.53, SIZE * 0.72);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.62, 'rgba(0,0,0,0.26)');
    v.addColorStop(1, 'rgba(3,4,7,0.78)');
    ctx.fillStyle = v;
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.restore();

    if (Render.noise) {
      ctx.save();
      ctx.globalAlpha = 0.055;
      ctx.globalCompositeOperation = 'overlay';
      ctx.drawImage(Render.noise, 0, 0, Render.noise.width, Render.noise.height, 0, 0, SIZE, SIZE);
      ctx.restore();
    }
  }

  /* ---------- 组装 ---------- */
  /* 游戏里的眼睛辉光按 48px 精灵绘制，放大到英雄体型会糊成一团；
     这里换成一个核心更紧的版本，只影响图标。 */
  (function tightenEyeGlow() {
    var size = 48;
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var g2 = c.getContext('2d');
    var grd = g2.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    grd.addColorStop(0, '#ff3a1e');
    grd.addColorStop(0.22, 'rgba(255,58,30,0.55)');
    grd.addColorStop(0.5, 'rgba(255,58,30,0.14)');
    grd.addColorStop(1, 'rgba(255,58,30,0)');
    g2.fillStyle = grd;
    g2.fillRect(0, 0, size, size);
    Render.glowCache['#ff3a1e|48'] = c;
  })();

  var origRandom = Math.random;
  Math.random = mulberry32(31337);

  var hero = mkZ({
    x: 530, y: 833, scale: 3.2, phase: 1.15, tint: '#7c8a70',
    attackT: 0.36, attackTotal: 0.9, attackHitT: 0.30, attackHitTotal: 0.6
  });
  var mid = mkZ({ x: 706, y: 768, scale: 2.1, phase: 0.35, tint: '#8fa07a', type: 'runner', r: 14 });
  var far = mkZ({ x: 812, y: 718, scale: 1.4, phase: 2.3, tint: '#69765f' });

  background();
  rift();
  // 裂隙在怪物背后的红光，形成剪影
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  var back = ctx.createRadialGradient(hero.x, hero.y - 40, 0, hero.x, hero.y - 40, 420);
  back.addColorStop(0, 'rgba(255,74,34,0.20)');
  back.addColorStop(1, 'rgba(255,74,34,0)');
  ctx.fillStyle = back;
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.restore();
  Render.drawZombie(far, 0.37);
  Render.drawZombie(mid, 0.37);
  house();
  doorLight();
  Render.drawZombie(hero, 0.37);
  atmosphere();

  Math.random = origRandom;
  window.ICON_READY = true;
})();
</script>
</body>
</html>
